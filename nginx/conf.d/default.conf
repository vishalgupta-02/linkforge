# =============================================================================
# HTTP Server (Port 80)
# Handles ACME challenges, healthcheck, and redirects all traffic to HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Internal Nginx health endpoint (unencrypted for fast local Docker probes)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Let's Encrypt ACME challenge location for automated certificate renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Permanent HTTP -> HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS Server (Port 443)
# SSL/TLS Termination and Secure Reverse Proxy to API and Web Services
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost _;

    # =========================================================================
    # SSL/TLS Certificate & Parameter Configuration
    # =========================================================================
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern TLS protocols only (TLS 1.0 & 1.1 explicitly disabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session Caching for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # =========================================================================
    # Production Security Headers
    # =========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Internal Nginx health endpoint
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # =========================================================================
    # ⚡ SSE (Server-Sent Events) Live Visitor Events Streaming
    # =========================================================================
    location /api/v1/live/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # Disable buffering and caching for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Extended timeouts for persistent visitor event streams
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =========================================================================
    # 🚀 Express API Routes (/api/*)
    # Forwarded without stripping `/api` prefix so /api/v1/... is preserved
    # =========================================================================
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse-proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Sensible proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffering tuning
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # =========================================================================
    # 🩺 Express API Healthcheck Endpoint (/health)
    # =========================================================================
    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =========================================================================
    # 📊 Bull Board Queue Administration UI (/admin/queues)
    # =========================================================================
    location /admin/queues {
        proxy_pass http://api_upstream/admin/queues;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =========================================================================
    # 📦 Next.js Immutable Static Assets (/_next/static/*)
    # =========================================================================
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Aggressive caching for hashed immutable assets
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # =========================================================================
    # 🌐 Next.js Frontend Application (/*) - Catch-all
    # =========================================================================
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        # WebSocket support for Next.js HMR/client connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse-proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
