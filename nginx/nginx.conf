events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Information hygiene: hide Nginx version
    server_tokens off;

    # Maximum request body size (supports media / avatar uploads)
    client_max_body_size 20M;

    # =========================================================================
    # Privacy-Conscious Logging Configuration
    # Strips query string from URI to prevent logging sensitive tokens
    # (e.g., password reset tokens, OAuth state)
    # =========================================================================
    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log sanitized;
    error_log  /var/log/nginx/error.log warn;

    # =========================================================================
    # Gzip Compression Settings
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/x-font-ttf
        font/opentype
        application/vnd.ms-fontobject;

    # =========================================================================
    # Upstream Services (Docker Internal Network)
    # =========================================================================
    upstream api_upstream {
        server api:5000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    # Include modular server configuration files
    include /etc/nginx/conf.d/*.conf;
}
