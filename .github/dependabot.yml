version: 2
updates:
  # ============================================================================
  # 1. Monorepo Package Dependencies (pnpm workspace managed from root)
  # ============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Strictly limit to 1 open PR/branch at a time; no new PRs/branches created until you merge or close it
    open-pull-requests-limit: 1
    # Prevents Dependabot from automatically pushing rebase commits/changes to the branch
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Block all major (breaking) updates across dependencies
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      sentry:
        patterns:
          - "@sentry/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "typescript"
          - "prettier*"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"

  # ============================================================================
  # 2. GitHub Actions Workflows
  # ============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Strictly limit to 1 open PR/branch at a time
    open-pull-requests-limit: 1
    # Prevents Dependabot from automatically pushing rebase commits/changes to the branch
    rebase-strategy: "disabled"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci(actions)"
    ignore:
      # Block major version upgrades for GitHub Actions workflows
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "actions/*"

  # ============================================================================
  # 3. Docker Base Images
  # ============================================================================
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "docker"
      - "dependencies"
    commit-message:
      prefix: "chore(docker-api)"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "docker"
      - "dependencies"
    commit-message:
      prefix: "chore(docker-web)"
