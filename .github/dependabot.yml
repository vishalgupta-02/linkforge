version: 2
updates:
  # ============================================================================
  # 1. Monorepo Package Dependencies (pnpm workspace managed from root)
  # ============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      sentry:
        patterns:
          - "@sentry/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "typescript"
          - "prettier*"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"

  # ============================================================================
  # 2. GitHub Actions Workflows
  # ============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns:
          - "actions/*"

  # ============================================================================
  # 3. Docker Base Images
  # ============================================================================
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "dependencies"
    commit-message:
      prefix: "chore(docker-api)"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "dependencies"
    commit-message:
      prefix: "chore(docker-web)"
