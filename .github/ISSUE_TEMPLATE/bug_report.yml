name: 🐛 Bug Report
description: Report an issue or unexpected behavior in LinkForge
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have tested against the latest `main` branch before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Provide details about your environment.
      value: |
        - OS: [e.g. Ubuntu 22.04, macOS Sonoma, Windows 11]
        - Node Version: [e.g. 20.18.0]
        - pnpm Version: [e.g. 11.21.0]
        - Browser (if UI issue): [e.g. Chrome 124, Safari 17]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any relevant error logs or attach screenshots.
      placeholder: Terminal output, browser console logs, or stack traces...
    validations:
      required: false
